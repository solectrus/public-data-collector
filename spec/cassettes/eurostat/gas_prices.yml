        Harmonised Index of Consumer Prices (HICP) measures price changes of various
        consumer goods and services over time (inflation). This dataset is compiled
        according to the European Classification&nbsp;of Individual Consumption&nbsp;According
        to Purpose (ECOICOP)&nbsp;ver. 2, available in base years 2025=100 and 2015=100.&nbsp;&nbsp;</p><p>This
        dataset includes&nbsp;four monthly&nbsp;indicators:&nbsp;</p><ul><li>the index, measuring price
        changes in relation to a base year&nbsp;</li><li>the annual rate of change,&nbsp;representing
        the percentage change in a reference month compared to the same month of the
        previous year (also called annual inflation)&nbsp;</li><li>the monthly rate
        of change,&nbsp;representing the percentage change in consumer price indices
        in a reference month compared to the previous month (also called monthly inflation)</li><li>the 12-month
        average rate of change,&nbsp;comparing the average index over a 12-month period
        to the average index previous 12-month period.</li></ul><p><br></p><p>All
        the rates are calculated from the monthly HICP indices.&nbsp;</p>","id":"PRC_HICP_MINR","agencyId":"ESTAT","version":"1.0","datastructure":{"id":"PRC_HICP_MINR","agencyId":"ESTAT","version":"25.0"},"annotation":[{"type":"CREATED","date":"2026-01-27T09:31:20+0100"},{"type":"DISSEMINATION_DOI_XML","title":"<adms:identifier
