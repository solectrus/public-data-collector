services:
  public-data-collector:
    image: ghcr.io/solectrus/public-data-collector:latest
    depends_on:
      influxdb:
        condition: service_healthy
    links:
      - influxdb
    environment:
      - TZ
      - COUNTRY
      - INTERVAL
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - PUBLIC_GRID_BIDDING_ZONE
      - PUBLIC_GRID_MEASUREMENT
      - PUBLIC_GRID_FIELD_PRICE
      - PUBLIC_GRID_FIELD_RENEWABLE_SHARE
      - PUBLIC_GRID_FIELD_CO2_INTENSITY
      - GAS_MEASUREMENT
      - FUEL_MEASUREMENT
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9-alpine
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    command: influxd run --bolt-path /var/lib/influxdb2/influxd.bolt --engine-path /var/lib/influxdb2/engine --store disk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
